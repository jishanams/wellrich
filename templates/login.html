{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Wellrich</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #f5f2ed;
  --white: #ffffff;
  --text: #1f1f1f;
  --muted: #666;
  --primary: #a63f33;
  --shadow: 0 15px 40px rgba(0,0,0,0.08);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Inter", sans-serif;
}

body {
  background: linear-gradient(135deg, #f5f2ed, #ffffff);
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* LOGIN BOX */
.login-wrapper {
  width: 100%;
  max-width: 420px;
  padding: 20px;
}

.login-card {
  background: var(--white);
  padding: 40px;
  border-radius: 24px;
  box-shadow: var(--shadow);
  text-align: center;
}

.login-title {
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 8px;
  color: var(--text);
}

.login-sub {
  font-size: 14px;
  color: var(--muted);
  margin-bottom: 30px;
}

/* INPUTS */
.input-group {
  text-align: left;
  margin-bottom: 18px;
}

.input-group label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
  display: block;
}

.input-group input {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid #ddd;
  border-radius: 12px;
  outline: none;
  transition: 0.3s;
}

.input-group input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(166,63,51,0.1);
}

/* BUTTON */
.btn-login {
  width: 100%;
  padding: 12px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 50px;
  font-weight: 700;
  cursor: pointer;
  transition: 0.3s;
  margin-top: 10px;
}

.btn-login:hover {
  background: #8e342a;
  transform: translateY(-2px);
}

/* LINKS */
.extra-links {
  margin-top: 18px;
  font-size: 13px;
  color: var(--muted);
}

.extra-links a {
  color: var(--primary);
  text-decoration: none;
  font-weight: 600;
}

.extra-links a:hover {
  text-decoration: underline;
}

/* RESPONSIVE */
@media (max-width: 480px) {
  .login-card {
    padding: 30px 20px;
  }
}
</style>
</head>

<body>

<div class="login-wrapper">

  <div class="login-card">

    <h2 class="login-title">Welcome Back</h2>
    <p class="login-sub">Login to continue to Wellrich Store</p>

    <form method="POST">
      {% csrf_token %}

      <div class="input-group">
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter username" required>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter password" required>
      </div>

      <button type="submit" class="btn-login"> <a href="{% url 'index' %}">Login</a></button>

    </form>

    <div class="extra-links">
      <p>Forgot password? <a href="#">Reset</a></p>
      <p>Don’t have an account? <a href="#">Register</a></p>
    </div>

  </div>

</div>

</body>
</html>
